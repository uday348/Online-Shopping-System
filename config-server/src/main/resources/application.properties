spring.application.name=CONFIG-SERVER

server.port=${PORT:8001}

spring.cloud.config.server.git.uri=https://github.com/uday348/online-shopping-system

spring.cloud.config.server.git.default-label=main

spring.cloud.config.server.git.clone-on-start=true

spring.cloud.config.server.git.skip-ssl-validation=true

spring.cloud.config.server.git.search-paths=config-server/config-server/src/main/resources

eureka.client.service-url.defaultZone=http://eureka-server:8000/eureka/

management.endpoints.web.exposure.include=*